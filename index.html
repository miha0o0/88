<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">도서관 - 우주 공간 커뮤니티</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Pretendard -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pinkbg: '#fff5f7',
                        pinkcard: '#ffffff',
                        pinkborder: '#ffccd5',
                        pinkaccent: '#ff5c8a',
                        pinkaccenthover: '#ff3366',
                        pinkmuted: '#ffa3b5',
                        pinktext: '#4a3b40',
                        pinksoft: '#fff0f3'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #fff5f7;
            --text-color: #4a3b40;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.3s ease;
            position: relative;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #ffe6eb; }
        ::-webkit-scrollbar-thumb { background: #ffb3c6; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff5c8a; }
        .sticker-item {
            position: absolute;
            cursor: move;
            user-select: none;
            touch-action: none;
            z-index: 40;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body id="main-body" class="min-h-screen flex flex-col justify-between p-3 sm:p-6 overflow-x-hidden">

    <!-- 로그인 / 회원가입 인증 레이어 -->
    <div id="auth-container" class="fixed inset-0 bg-[#0f0c29]/90 backdrop-blur-md flex justify-center items-center z-50">
        <div class="bg-white/10 p-8 rounded-3xl backdrop-blur-md text-center w-80 shadow-2xl border border-white/20 text-white">
            <h2 class="text-xl font-bold mb-2 text-pink-300">📖 도서관 입장</h2>
            <p class="text-xs text-pink-200 mb-6">아이디를 입력해 도서관에 접속하세요.</p>
            <input type="text" id="username-input" placeholder="아이디" class="w-full px-4 py-3 mb-3 rounded-2xl bg-white/20 border border-white/30 text-white placeholder-pink-200 text-xs focus:outline-none">
            <input type="password" id="password-input" placeholder="비밀번호" class="w-full px-4 py-3 mb-4 rounded-2xl bg-white/20 border border-white/30 text-white placeholder-pink-200 text-xs focus:outline-none">
            <button onclick="handleLogin()" class="w-full py-3 bg-pinkaccent text-white rounded-2xl font-bold text-xs shadow-md hover:bg-pinkaccenthover transition mb-2">로그인</button>
            <button onclick="handleRegister()" class="w-full py-3 bg-white/20 text-white rounded-2xl font-bold text-xs shadow-md hover:bg-white/35 transition">회원가입</button>
        </div>
    </div>

    <!-- 스티커 레이어 -->
    <div id="sticker-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-30"></div>

    <!-- 상단 도서관 네비게이션 바 -->
    <header class="w-full max-w-6xl mx-auto flex items-center justify-between mb-4 px-3 relative z-50">
        <div class="flex items-center space-x-2 font-bold text-xs sm:text-sm">
            <span class="bg-pinkcard border border-pinkborder px-3.5 py-1.5 rounded-full text-xs text-pinkaccent shadow-sm flex items-center gap-1.5">
                <i class="fa-solid fa-book-open"></i> <span id="site-name-text">도서관 (Library)</span>
            </span>
            <span id="user-role-badge" class="text-[11px] bg-pinksoft px-2.5 py-1 rounded-full border border-pinkborder text-pinktext font-semibold"></span>
        </div>
        <div class="flex items-center gap-2 text-xs font-medium">
            <button onclick="openStickerModal()" class="bg-pinkcard hover:bg-pinksoft border border-pinkborder px-3.5 py-1.5 rounded-full text-pinktext shadow-sm transition flex items-center gap-1.5 font-semibold">
                <i class="fa-solid fa-note-sticky text-[11px] text-pinkaccent"></i> 스티커 (<span id="sticker-count">0</span>)
            </button>
            <button onclick="openSettingsModal()" class="bg-pinkcard hover:bg-pinksoft border border-pinkborder px-3.5 py-1.5 rounded-full text-pinktext shadow-sm transition flex items-center gap-1.5 font-semibold">
                <i class="fa-solid fa-gear text-[11px] text-pinkaccent"></i> 설정
            </button>
            <button onclick="handleLogout()" class="bg-red-50 hover:bg-red-100 border border-red-200 px-3 py-1.5 rounded-full text-red-500 shadow-sm transition font-semibold">
                로그아웃
            </button>
        </div>
    </header>

    <!-- 메인 컨테이너 (도서관 메인 + 미니홈피 통합) -->
    <main class="w-full max-w-6xl mx-auto bg-pinkcard/95 backdrop-blur-md rounded-3xl border border-pinkborder shadow-xl overflow-hidden flex flex-col md:flex-row relative z-20">
        
        <!-- 좌측 사이드바: 프로필 및 도서관 카테고리 -->
        <aside class="w-full md:w-80 p-6 bg-pinksoft/60 border-b md:border-b-0 md:border-r border-pinkborder flex flex-col gap-5 relative">
            <div class="bg-pinkcard p-5 rounded-3xl border border-pinkborder shadow-sm flex flex-col items-center text-center relative overflow-hidden">
                <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden border-2 border-pinkcard shadow-md my-2 bg-pink-100 relative group z-10 cursor-pointer" onclick="openProfileEditModal()" title="프로필 편집">
                    <img id="profile-img" src="https://placehold.co/300x300/ffe6eb/ff5c8a?text=Library" alt="Profile" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-pinkaccent/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold">프로필 편집</div>
                </div>

                <h2 id="profile-name" class="font-bold text-base text-pinktext z-10 mt-1">도서관 이용자</h2>
                <p id="profile-sub" class="text-xs text-pinkaccent font-semibold mb-3 z-10">믱믱별 외계인 탐험 중</p>

                <div class="flex items-center justify-center gap-3 w-full text-xs bg-pinksoft py-2.5 px-3 rounded-2xl border border-pinkborder text-pinktext font-medium z-10">
                    <div>Today <span class="text-pinkaccent font-bold">24</span></div>
                    <div class="w-px h-3 bg-pinkborder"></div>
                    <div>Total <span class="text-pinkaccent font-bold">3,150</span></div>
                </div>
            </div>

            <!-- 도서관 네비게이션 탭 -->
            <div class="bg-pinkcard p-4 rounded-3xl border border-pinkborder shadow-sm">
                <h3 class="text-xs font-bold text-pinkaccent uppercase tracking-wider mb-3 px-1">LIBRARY MENU</h3>
                <ul class="space-y-1.5 text-sm font-medium">
                    <li>
                        <button onclick="switchTab('library')" id="tab-library-btn" class="nav-btn w-full text-left px-3.5 py-2 rounded-2xl bg-pinkaccent text-white flex items-center justify-between transition">
                            <span class="flex items-center gap-2.5">📖 도서관 홈</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="switchTab('home')" id="tab-home-btn" class="nav-btn w-full text-left px-3.5 py-2 rounded-2xl hover:bg-pinksoft text-pinktext flex items-center justify-between transition">
                            <span class="flex items-center gap-2.5">🏠 미니홈피 (전체글)</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="switchTab('posts')" id="tab-posts-btn" class="nav-btn w-full text-left px-3.5 py-2 rounded-2xl hover:bg-pinksoft text-pinktext flex items-center justify-between transition">
                            <span class="flex items-center gap-2.5">✍️ 게시글 작성</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="switchTab('archive')" id="tab-archive-btn" class="nav-btn w-full text-left px-3.5 py-2 rounded-2xl hover:bg-pinksoft text-pinktext flex items-center justify-between transition">
                            <span class="flex items-center gap-2.5">🎟️ 티켓 갤러리</span>
                        </button>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- 우측 메인 컨텐츠 영역 -->
        <div class="flex-1 flex flex-col p-6 bg-pinkcard">
            <div id="content-container" class="flex-1 flex flex-col gap-5">
                <!-- 탭별 내용이 동적으로 로드됩니다 -->
            </div>
        </div>
    </main>

    <!-- 음악 플레이어 위젯 -->
    <div id="music-player" class="fixed bottom-5 right-5 z-50 w-80 bg-pinkcard rounded-3xl border border-pinkborder shadow-2xl overflow-hidden transition-all duration-300">
        <div id="youtube-container" class="hidden"></div>
        <div class="bg-pinksoft px-4 py-2.5 border-b border-pinkborder flex items-center justify-between text-pinktext text-xs font-bold">
            <span class="flex items-center gap-2"><i class="fa-solid fa-music text-pinkaccent"></i> LIBRARY BGM</span>
            <div class="flex items-center gap-2">
                <button onclick="openBgmModal()" class="hover:text-pinkaccent transition"><i class="fa-solid fa-link text-xs"></i></button>
                <button onclick="toggleMusicPlayer()" class="hover:text-pinktext transition"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
        </div>
        <div class="p-4 flex flex-col gap-3.5 bg-pinkcard">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-pinksoft rounded-2xl border border-pinkborder flex items-center justify-center text-pinkaccent">
                    <i class="fa-solid fa-compact-disc text-xl animate-spin" style="animation-duration: 5s;"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 id="song-title" class="text-xs font-bold text-pinktext truncate">도서관 로파이 BGM</h4>
                    <p id="song-artist" class="text-[11px] text-pinkaccent truncate">YouTube Audio</p>
                </div>
            </div>
            <div class="flex items-center justify-between pt-1">
                <button onclick="openBgmModal()" class="text-pinkmuted hover:text-pinktext transition text-xs font-medium"><i class="fa-solid fa-link"></i> 링크설정</button>
                <button onclick="togglePlayState()" id="play-btn" class="w-10 h-10 bg-pinkaccent hover:bg-pinkaccenthover text-white rounded-full flex items-center justify-center shadow-md transition">
                    <i class="fa-solid fa-play text-xs" id="play-icon"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 모달창 모음 -->
    <div id="settings-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-pinkcard rounded-3xl border border-pinkborder shadow-2xl max-w-sm w-full p-6 text-center">
            <h3 class="text-base font-bold text-pinkaccent mb-2">도서관 배경설정</h3>
            <input type="file" id="bg-file-input" accept="image/*" class="w-full mb-4 text-xs">
            <div class="flex gap-2.5">
                <button onclick="closeSettingsModal()" class="flex-1 bg-pink-100 text-pinktext py-2.5 rounded-2xl text-xs font-semibold">취소</button>
                <button onclick="applyBackgroundFile()" class="flex-1 bg-pinkaccent text-white py-2.5 rounded-2xl text-xs font-semibold">적용</button>
            </div>
        </div>
    </div>

    <div id="sticker-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-pinkcard rounded-3xl border border-pinkborder shadow-2xl max-w-sm w-full p-6 text-center">
            <h3 class="text-base font-bold text-pinkaccent mb-2">스티커 추가</h3>
            <input type="file" id="sticker-file-input" accept="image/*" class="w-full mb-4 text-xs">
            <div class="flex gap-2.5">
                <button onclick="closeStickerModal()" class="flex-1 bg-pink-100 text-pinktext py-2.5 rounded-2xl text-xs font-semibold">닫기</button>
                <button onclick="uploadSticker()" class="flex-1 bg-pinkaccent text-white py-2.5 rounded-2xl text-xs font-semibold">부착</button>
            </div>
        </div>
    </div>

    <div id="bgm-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-pinkcard rounded-3xl border border-pinkborder shadow-2xl max-w-sm w-full p-6 text-center">
            <h3 class="text-base font-bold text-pinkaccent mb-2">유튜브 BGM 링크 설정</h3>
            <input type="text" id="youtube-url-input" placeholder="YouTube URL 입력" class="w-full px-4 py-2.5 bg-pinksoft border border-pinkborder rounded-2xl text-xs text-pinktext mb-4 focus:outline-none">
            <div class="flex gap-2.5">
                <button onclick="closeBgmModal()" class="flex-1 bg-pink-100 text-pinktext py-2.5 rounded-2xl text-xs font-semibold">취소</button>
                <button onclick="applyYouTubeBgm()" class="flex-1 bg-pinkaccent text-white py-2.5 rounded-2xl text-xs font-semibold">적용</button>
            </div>
        </div>
    </div>

    <div id="profile-edit-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-pinkcard rounded-3xl border border-pinkborder shadow-2xl max-w-sm w-full p-6 text-center">
            <h3 class="text-base font-bold text-pinkaccent mb-2">프로필 편집</h3>
            <input type="file" id="edit-avatar-file" accept="image/*" class="w-full mb-3 text-xs">
            <input type="text" id="edit-name-input" placeholder="닉네임" class="w-full px-3 py-2 bg-pinksoft border border-pinkborder rounded-xl text-xs mb-2">
            <input type="text" id="edit-sub-input" placeholder="상태 메시지" class="w-full px-3 py-2 bg-pinksoft border border-pinkborder rounded-xl text-xs mb-4">
            <div class="flex gap-2.5">
                <button onclick="closeProfileEditModal()" class="flex-1 bg-pink-100 text-pinktext py-2.5 rounded-2xl text-xs font-semibold">취소</button>
                <button onclick="applyProfileEdit()" class="flex-1 bg-pinkaccent text-white py-2.5 rounded-2xl text-xs font-semibold">저장</button>
            </div>
        </div>
    </div>

    <div id="custom-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-pinkcard rounded-3xl border border-pinkborder shadow-2xl max-w-sm w-full p-6 text-center">
            <h3 id="modal-title" class="text-base font-bold text-pinkaccent mb-2">알림</h3>
            <p id="modal-message" class="text-xs text-pinktext mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-pinkaccent text-white py-2.5 rounded-2xl text-xs font-semibold">확인</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('library_db')) || { users: [], posts: [], tickets: [] };
        let currentUser = JSON.parse(localStorage.getItem('library_current_user')) || null;

        window.onload = function() {
            if (currentUser) {
                document.getElementById('auth-container').classList.add('hidden');
                initSession();
            }
        };

        function openModal(title, msg) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        // 회원가입 및 로그인 관리
        function handleRegister() {
            const u = document.getElementById('username-input').value.trim();
            const p = document.getElementById('password-input').value.trim();
            if(!u || !p) return openModal('오류', '아이디와 비밀번호를 입력해주세요.');
            if(db.users.find(user => user.username === u)) return openModal('오류', '이미 존재하는 아이디입니다.');

            const newUser = {
                username: u,
                password: p,
                role: '믱믱별 외계인',
                profile: { name: u, sub: '우주 도서관 탐험 중', img: '' },
                world: '여기는 나의 도서관 세계입니다.'
            };
            db.users.push(newUser);
            localStorage.setItem('library_db', JSON.stringify(db));
            openModal('가입 완료', '회원가입이 완료되었습니다! 로그인해주세요.');
        }

        function handleLogin() {
            const u = document.getElementById('username-input').value.trim();
            const p = document.getElementById('password-input').value.trim();
            const user = db.users.find(user => user.username === u && user.password === p);
            if(!user) return openModal('로그인 실패', '아이디 또는 비밀번호가 올바르지 않습니다.');

            currentUser = user;
            localStorage.setItem('library_current_user', JSON.stringify(currentUser));
            document.getElementById('auth-container').classList.add('hidden');
            initSession();
        }

        function handleLogout() {
            localStorage.removeItem('library_current_user');
            location.reload();
        }

        function initSession() {
            document.getElementById('user-role-badge').innerText = `등급: ${currentUser.role}`;
            document.getElementById('profile-name').innerText = currentUser.profile.name;
            document.getElementById('profile-sub').innerText = currentUser.profile.sub;
            if(currentUser.profile.img) document.getElementById('profile-img').src = currentUser.profile.img;
            switchTab('library');
        }

        // 탭 전환 시스템 (도서관 홈이 최우선 맨 앞에 위치)
        function switchTab(tabId) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn w-full text-left px-3.5 py-2 rounded-2xl hover:bg-pinksoft text-pinktext flex items-center justify-between transition";
            });
            const activeBtn = document.getElementById('tab-' + tabId + '-btn');
            if(activeBtn) activeBtn.className = "nav-btn w-full text-left px-3.5 py-2 rounded-2xl bg-pinkaccent text-white flex items-center justify-between transition";

            const area = document.getElementById('content-container');
            area.innerHTML = '';

            if(tabId === 'library') {
                area.innerHTML = `
                    <div class="bg-pinksoft/70 rounded-3xl border border-pinkborder p-6 shadow-sm space-y-4">
                        <div class="w-full h-44 rounded-2xl bg-gradient-to-r from-pink-400 to-pinkaccent p-6 text-white flex flex-col justify-end shadow-inner">
                            <h2 class="text-xl font-extrabold">📖 우주 도서관 로비에 오신 것을 환영합니다</h2>
                            <p class="text-xs text-pink-100 mt-1">지식과 감성을 공유하고, 나만의 미니홈피를 꾸며보세요.</p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-pinkcard p-4 rounded-2xl border border-pinkborder shadow-xs">
                                <h4 class="text-xs font-bold text-pinkaccent mb-1">💡 도서관 공지</h4>
                                <p class="text-xs text-pinktext">모든 이용자분들은 자유롭게 글을 작성하고 스티커를 부착할 수 있습니다.</p>
                            </div>
                            <div class="bg-pinkcard p-4 rounded-2xl border border-pinkborder shadow-xs">
                                <h4 class="text-xs font-bold text-pinkaccent mb-1">✨ 오늘의 방문자</h4>
                                <p class="text-xs text-pinktext">현재 접속 중인 외계인들과 소통을 시작해보세요!</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if(tabId === 'home') {
                area.innerHTML = `
                    <div class="bg-pinksoft/70 rounded-3xl border border-pinkborder p-6 shadow-sm space-y-4">
                        <h3 class="text-sm font-bold text-pinkaccent">미니홈피 전체 게시글</h3>
                        <div id="posts-preview-list" class="space-y-3">
                            <div class="p-4 bg-pinkcard rounded-2xl border border-pinkborder text-xs text-center text-pinkmuted">아직 작성된 글이 없습니다.</div>
                        </div>
                    </div>
                `;
                loadPostsPreview();
            } else if(tabId === 'posts') {
                area.innerHTML = `
                    <div class="bg-pinksoft/70 rounded-3xl border border-pinkborder p-6 shadow-sm space-y-3">
                        <h3 class="text-sm font-bold text-pinkaccent">새로운 글 작성</h3>
                        <input type="text" id="post-title" placeholder="제목을 입력하세요..." class="w-full px-4 py-2.5 bg-pinkcard border border-pinkborder rounded-2xl text-xs text-pinktext focus:outline-none">
                        <textarea id="post-content" rows="4" placeholder="따뜻한 이야기를 남겨주세요..." class="w-full px-4 py-3 bg-pinkcard border border-pinkborder rounded-2xl text-xs text-pinktext resize-none focus:outline-none"></textarea>
                        <div class="flex justify-end">
                            <button onclick="submitPost()" class="bg-pinkaccent text-white px-5 py-2.5 rounded-2xl text-xs font-semibold shadow-md">등록하기</button>
                        </div>
                    </div>
                `;
            } else if(tabId === 'archive') {
                area.innerHTML = `
                    <div class="bg-pinksoft/70 rounded-3xl border border-pinkborder p-6 shadow-sm space-y-4">
                        <h3 class="text-sm font-bold text-pinkaccent">🎟️ 콜렉터블 티켓 갤러리</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="ticket-grid">
                            <div class="bg-white p-4 rounded-2xl border-2 border-dashed border-pinkaccent shadow-md flex items-center justify-between">
                                <span class="text-xs font-bold text-pinkaccent">기본 도서관 패스</span>
                                <span class="text-[10px] text-pinkmuted">#2026-0923</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // 게시글 작성 로직
        function submitPost() {
            const t = document.getElementById('post-title').value.trim();
            const c = document.getElementById('post-content').value.trim();
            if(!t || !c) return openModal('알림', '제목과 내용을 모두 입력해주세요.');

            db.posts = db.posts || [];
            db.posts.unshift({ title: t, content: c, author: currentUser.username, time: new Date().toLocaleDateString() });
            localStorage.setItem('library_db', JSON.stringify(db));
            openModal('성공', '게시글이 등록되었습니다!');
            switchTab('home');
        }

        function loadPostsPreview() {
            const list = document.getElementById('posts-preview-list');
            if(!db.posts || db.posts.length === 0) return;
            list.innerHTML = db.posts.map(p => `
                <div class="p-4 bg-pinkcard rounded-2xl border border-pinkborder text-xs flex justify-between items-center">
                    <div><span class="text-pinkaccent font-bold">[글]</span> ${p.title}</div>
                    <span class="text-[10px] text-pinkmuted">${p.author} | ${p.time}</span>
                </div>
            `).join('');
        }

        // 모달 및 설정 관리
        function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
        function openBgmModal() { document.getElementById('bgm-modal').classList.remove('hidden'); }
        function closeBgmModal() { document.getElementById('bgm-modal').classList.add('hidden'); }
        function openStickerModal() { document.getElementById('sticker-modal').classList.remove('hidden'); }
        function closeStickerModal() { document.getElementById('sticker-modal').classList.add('hidden'); }
        function openProfileEditModal() { document.getElementById('profile-edit-modal').classList.remove('hidden'); }
        function closeProfileEditModal() { document.getElementById('profile-edit-modal').classList.add('hidden'); }

        function applyBackgroundFile() {
            const fileInput = document.getElementById('bg-file-input');
            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('main-body').style.backgroundImage = `url('${e.target.result}')`;
                    closeSettingsModal();
                    openModal('적용', '배경화면이 적용되었습니다!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function applyProfileEdit() {
            const name = document.getElementById('edit-name-input').value.trim();
            const sub = document.getElementById('edit-sub-input').value.trim();
            const fileInput = document.getElementById('edit-avatar-file');

            if(name) currentUser.profile.name = name;
            if(sub) currentUser.profile.sub = sub;

            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUser.profile.img = e.target.result;
                    document.getElementById('profile-img').src = e.target.result;
                    saveUserChanges();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveUserChanges();
            }
        }

        function saveUserChanges() {
            const idx = db.users.findIndex(u => u.username === currentUser.username);
            if(idx !== -1) db.users[idx] = currentUser;
            localStorage.setItem('library_db', JSON.stringify(db));
            localStorage.setItem('library_current_user', JSON.stringify(currentUser));
            initSession();
            closeProfileEditModal();
            openModal('수정 완료', '프로필이 업데이트되었습니다!');
        }

        let stickerCount = 0;
        function uploadSticker() {
            const fileInput = document.getElementById('sticker-file-input');
            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    stickerCount++;
                    document.getElementById('sticker-count').innerText = stickerCount;
                    const el = document.createElement('div');
                    el.className = 'sticker-item';
                    el.style.left = (50 + (stickerCount * 25)) + 'px';
                    el.style.top = (100 + (stickerCount * 25)) + 'px';
                    el.innerHTML = `<img src="${e.target.result}" class="w-16 h-16 object-contain pointer-events-none">`;
                    document.getElementById('sticker-layer').appendChild(el);
                    closeStickerModal();
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        let isPlaying = false;
        function togglePlayState() {
            isPlaying = !isPlaying;
            document.getElementById('play-icon').className = isPlaying ? "fa-solid fa-pause text-xs" : "fa-solid fa-play text-xs";
            openModal('BGM', isPlaying ? '음악 재생 중 🎶' : '음악 일시정지');
        }
        function toggleMusicPlayer() {
            document.getElementById('music-player').classList.toggle('translate-y-full');
        }
        function applyYouTubeBgm() {
            closeBgmModal();
            openModal('설정 완료', '유튜브 BGM이 설정되었습니다!');
        }
    </script>
</body>
</html>
